  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M318 56 C302 100 257 164 211 238 C176 294 143 352 117 399 C170 388 237 386 319 386 C401 386 469 388 523 399 C497 352 464 294 429 238 C383 164 338 100 318 56 Z" stroke-width="18"/>
    <path d="M186 267 C255 258 361 258 454 267" stroke-width="14"/>
