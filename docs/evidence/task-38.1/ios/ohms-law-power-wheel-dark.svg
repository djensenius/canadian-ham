<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960"><rect width="100%" height="100%" fill="#2A241D"/><g color="#F3E8D2">
  <title>Ohm's law and power formula wheel</title>
  <desc>A four-quadrant formula wheel grouping ways to find P, E, I, and R.</desc>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="480" cy="480" r="405" stroke-width="18"/>
    <path d="M480 88 C486 170 486 286 480 370" stroke-width="10"/>
    <path d="M480 590 C486 674 486 790 480 872" stroke-width="10"/>
    <path d="M88 480 C170 486 286 486 370 480" stroke-width="10"/>
    <path d="M590 480 C674 486 790 486 872 480" stroke-width="10"/>
    <circle cx="480" cy="480" r="100" stroke-width="9"/>
  </g>
  <g fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="480" y="468" font-size="38" font-weight="700">find</text>
    <text x="480" y="515" font-size="38" font-weight="700">unknown</text>

    <text x="300" y="200" font-size="76" font-weight="800">P</text>
    <text x="300" y="260" font-size="36" font-weight="700">I x E</text>
    <text x="300" y="310" font-size="36" font-weight="700">I² x R</text>
    <text x="300" y="360" font-size="36" font-weight="700">E² / R</text>

    <text x="660" y="200" font-size="76" font-weight="800">E</text>
    <text x="660" y="260" font-size="36" font-weight="700">I x R</text>
    <text x="660" y="310" font-size="36" font-weight="700">P / I</text>
    <text x="660" y="360" font-size="36" font-weight="700">√(P x R)</text>

    <text x="300" y="590" font-size="76" font-weight="800">I</text>
    <text x="300" y="650" font-size="36" font-weight="700">E / R</text>
    <text x="300" y="700" font-size="36" font-weight="700">P / E</text>
    <text x="300" y="750" font-size="36" font-weight="700">√(P / R)</text>

    <text x="660" y="590" font-size="76" font-weight="800">R</text>
    <text x="660" y="650" font-size="36" font-weight="700">E / I</text>
    <text x="660" y="700" font-size="36" font-weight="700">E² / P</text>
    <text x="660" y="750" font-size="36" font-weight="700">P / I²</text>
  </g>
</g></svg>
