<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><rect width="100%" height="100%" fill="#FFF8EA"/><g color="#1F1A14">
  <title>Ohm's law triangle</title>
  <desc>A memory triangle with E above I and R, separated by a horizontal bar.</desc>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M320 58 C314 77 292 113 264 158 C220 229 171 309 126 398 C173 388 239 386 320 386 C401 386 467 388 514 398 C469 309 420 229 376 158 C348 113 326 77 320 58 Z" stroke-width="18"/>
    <path d="M190 267 C239 258 307 256 450 267" stroke-width="14"/>
    <path d="M320 290 C316 315 316 345 320 375" stroke-width="10"/>
  </g>
  <g fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
