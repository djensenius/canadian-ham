<svg id="loop-antenna-patterns" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img">
  <title>Dipole, quad, and delta loop patterns</title>
  <desc>Three panels show a dipole broadside pattern, square quad loops, and a triangular delta loop with horizontal and vertical feed points marked.</desc>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86 326 C130 320 190 320 234 326" stroke-width="10"/>
    <ellipse cx="160" cy="326" rx="56" ry="126" stroke-width="8"/>
    <path d="M86 326 C62 326 42 326 24 326" stroke-width="5"/>
    <path d="M234 326 C258 326 278 326 296 326" stroke-width="5"/>

    <polygon points="340,244 450,244 450,354 340,354" stroke-width="8"/>
    <polygon points="490,244 600,244 600,354 490,354" stroke-width="8"/>
    <path d="M316 300 C404 294 528 294 624 300" stroke-width="8"/>
    <circle cx="395" cy="354" r="10" fill="currentColor" stroke="none"/>

    <polygon points="760,218 872,430 648,430" stroke-width="8"/>
    <circle cx="760" cy="430" r="10" fill="currentColor" stroke="none"/>
    <circle cx="704" cy="324" r="10" fill="currentColor" stroke="none"/>
    <path d="M760 430 C760 458 760 484 760 510" stroke-width="6"/>
    <path d="M704 324 C674 302 646 282 620 264" stroke-width="6"/>
  </g>
  <g fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="160" y="72" font-size="40" font-weight="700">dipole</text>
    <text x="160" y="122" font-size="36">broadside</text>
    <text x="64" y="270" font-size="36">weak</text>
    <text x="268" y="286" font-size="36">weak</text>

    <text x="468" y="72" font-size="40" font-weight="700">quad loops</text>
    <text x="395" y="420" font-size="36">feed point</text>

    <text x="760" y="72" font-size="40" font-weight="700">delta loop</text>
    <text x="760" y="552" font-size="36">H feed</text>
    <text x="650" y="198" font-size="36">V feed</text>

    <text x="480" y="606" font-size="40" font-weight="700">loop length ≈ 306 / f(MHz)</text>
  </g>
</svg>
