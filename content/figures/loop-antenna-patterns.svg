<svg id="loop-antenna-patterns" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img">
  <title>Dipole, quad, and delta loop patterns</title>
  <desc>Three panels show a dipole doughnut pattern, square quad loops, and a delta loop with bottom and side feed points.</desc>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="160" cy="330" rx="120" ry="62" stroke-width="8"/>
    <ellipse cx="160" cy="330" rx="54" ry="118" stroke-width="6"/>
    <path d="M48 330 C105 324 216 324 274 330" stroke-width="11"/>
    <path d="M160 330 C160 302 160 276 160 250" stroke-width="6"/>

    <polygon points="394,234 560,234 560,400 394,400" stroke-width="8"/>
    <polygon points="426,270 528,270 528,372 426,372" stroke-width="7"/>
    <path d="M374 317 C438 313 520 313 584 317" stroke-width="8"/>
    <circle cx="477" cy="400" r="10" fill="currentColor" stroke="none"/>

    <polygon points="752,220 864,430 640,430" stroke-width="8"/>
    <circle cx="752" cy="430" r="10" fill="currentColor" stroke="none"/>
    <circle cx="696" cy="325" r="10" fill="currentColor" stroke="none"/>
    <path d="M752 430 C752 456 752 482 752 506" stroke-width="6"/>
    <path d="M696 325 C668 306 642 288 618 270" stroke-width="6"/>
  </g>
  <g fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="160" y="78" font-size="40" font-weight="700">dipole</text>
    <text x="160" y="126" font-size="36">broadside</text>
    <text x="160" y="172" font-size="36">doughnut</text>
    <text x="160" y="506" font-size="36">weak ends</text>

    <text x="477" y="78" font-size="40" font-weight="700">quad loops</text>
    <text x="477" y="456" font-size="36">quad loop</text>

    <text x="752" y="78" font-size="40" font-weight="700">delta loop</text>
    <text x="752" y="548" font-size="36">bottom feed</text>
    <text x="620" y="190" font-size="36">side feed</text>

    <text x="480" y="604" font-size="40" font-weight="700">loop length ≈ 306 / f(MHz)</text>
  </g>
</svg>
