<svg id="metric-prefix-ladder" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" role="img">
  <title>Metric prefix ladder</title>
  <desc>A ladder of electronics metric prefixes from giga to pico, with conversion direction arrows and a MHz to kHz example.</desc>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <line x1="230" y1="95" x2="850" y2="95" stroke-width="8"/>
    <line x1="850" y1="185" x2="230" y2="185" stroke-width="8"/>
    <rect x="15" y="245" width="150" height="160" stroke-width="6"/>
    <rect x="165" y="245" width="150" height="160" stroke-width="6"/>
    <rect x="315" y="245" width="150" height="160" stroke-width="6"/>
    <rect x="465" y="245" width="150" height="160" stroke-width="6"/>
    <rect x="615" y="245" width="150" height="160" stroke-width="6"/>
    <rect x="765" y="245" width="150" height="160" stroke-width="6"/>
    <rect x="915" y="245" width="150" height="160" stroke-width="6"/>
  </g>
  <g fill="currentColor">
    <polygon points="850 95 825 82 829 108"/>
    <polygon points="230 185 255 172 251 198"/>
  </g>
  <g fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="540" y="70" font-size="40">to a smaller unit → × 1 000</text>
    <text x="540" y="150" font-size="40">to a larger unit ← ÷ 1 000</text>
    <text x="90" y="310" font-size="50" font-weight="700">G</text>
    <text x="90" y="370" font-size="40">giga</text>
    <text x="240" y="310" font-size="50" font-weight="700">M</text>
    <text x="240" y="370" font-size="40">mega</text>
    <text x="390" y="310" font-size="50" font-weight="700">k</text>
    <text x="390" y="370" font-size="40">kilo</text>
    <text x="540" y="310" font-size="50" font-weight="700">1</text>
    <text x="540" y="370" font-size="40">base</text>
    <text x="690" y="310" font-size="50" font-weight="700">m</text>
    <text x="690" y="370" font-size="40">milli</text>
    <text x="840" y="310" font-size="50" font-weight="700">µ</text>
    <text x="840" y="370" font-size="40">micro</text>
    <text x="990" y="310" font-size="50" font-weight="700">p</text>
    <text x="990" y="370" font-size="40">pico</text>
    <text x="540" y="488" font-size="42">example</text>
    <text x="540" y="570" font-size="42">14.230 MHz → 14 230 kHz</text>
    <text x="540" y="640" font-size="40">µ to p: × or ÷ 1 000 000</text>
  </g>
</svg>
