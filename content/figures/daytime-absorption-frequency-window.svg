  <g fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="340" y="58" font-size="40" font-weight="700">daytime path</text>
    <text x="250" y="304" font-size="38" font-weight="700">D absorbs lows</text>
    <text x="330" y="142" font-size="38" font-weight="700">F returns</text>


