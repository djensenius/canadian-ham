    <text x="186" y="58" font-size="40" font-weight="700">low-pass</text>
    <text x="128" y="100" font-size="36">pass</text>
    <text x="250" y="300" font-size="36">atten</text>

    <text x="498" y="58" font-size="40" font-weight="700">high-pass</text>
