<svg id="morse-rst-contact-flow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Morse contact and RST flow</title>
  <desc>A Morse contact timeline moves from a busy-frequency check through CQ, DE, call signs, RST, and sign-off, with readability, strength, and tone gauges.</desc>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <line x1="50" y1="210" x2="468" y2="210" stroke-width="6"/>
    <polygon points="468,210 448,198 448,222" fill="currentColor" stroke="none"/>
    <line x1="82" y1="188" x2="82" y2="232" stroke-width="5"/>
    <line x1="154" y1="188" x2="154" y2="232" stroke-width="5"/>
    <line x1="226" y1="188" x2="226" y2="232" stroke-width="5"/>
    <line x1="298" y1="188" x2="298" y2="232" stroke-width="5"/>
    <line x1="370" y1="188" x2="370" y2="232" stroke-width="5"/>
    <line x1="442" y1="188" x2="442" y2="232" stroke-width="5"/>
    <circle cx="74" cy="118" r="6" stroke-width="5"/>
    <line x1="96" y1="118" x2="126" y2="118" stroke-width="5"/>
    <circle cx="146" cy="118" r="6" stroke-width="5"/>
    <circle cx="170" cy="118" r="6" stroke-width="5"/>
    <line x1="192" y1="118" x2="222" y2="118" stroke-width="5"/>
    <line x1="244" y1="118" x2="274" y2="118" stroke-width="5"/>
    <rect x="492" y="86" width="112" height="286" rx="18" ry="18" stroke-width="6"/>
    <path d="M516 160 C540 128 564 128 588 160" stroke-width="5"/>
    <path d="M516 238 C540 206 564 206 588 238" stroke-width="5"/>
    <path d="M516 316 C540 284 564 284 588 316" stroke-width="5"/>
    <line x1="552" y1="160" x2="574" y2="132" stroke-width="5"/>
    <line x1="552" y1="238" x2="582" y2="222" stroke-width="5"/>
    <line x1="552" y1="316" x2="572" y2="292" stroke-width="5"/>
  </g>
  <g fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="82" y="272" font-size="24">QRL?</text>
    <text x="154" y="272" font-size="24">CQ</text>
    <text x="226" y="272" font-size="24">DE</text>
    <text x="298" y="272" font-size="24">calls</text>
    <text x="370" y="272" font-size="24">RST</text>
    <text x="442" y="272" font-size="24">73</text>
    <text x="174" y="82" font-size="24">dots and dashes</text>
    <text x="548" y="124" font-size="24">R</text>
    <text x="548" y="202" font-size="24">S</text>
    <text x="548" y="280" font-size="24">T</text>
    <text x="540" y="410" font-size="24">meter note</text>
  </g>
</svg>
