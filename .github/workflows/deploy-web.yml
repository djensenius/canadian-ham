name: Deploy web to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release-permission-gate:
    name: ISED permission gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      # actions/checkout v7.0.1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Block deployment until ISED permission is recorded
        run: node scripts/check-release-permission.mjs

  deploy:
    name: Build and deploy GitHub Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: release-permission-gate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # actions/checkout v7.0.1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # pnpm/action-setup v6.1.0
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false

      # actions/setup-node v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # actions/configure-pages v5.0.0
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Resolve GitHub Pages base path
        id: pages-base
        shell: bash
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail

          case "${BASE_PATH}" in
            ""|"/") resolved_base_path="/" ;;
            /*/) resolved_base_path="${BASE_PATH}" ;;
            /*) resolved_base_path="${BASE_PATH}/" ;;
            *)
              echo "configure-pages returned an invalid base_path: ${BASE_PATH}" >&2
              exit 1
              ;;
          esac

          echo "base_path=${resolved_base_path}" >> "${GITHUB_OUTPUT}"

      - name: Build web app for the GitHub Pages site
        env:
          CANADIAN_HAM_WEB_BASE_PATH: ${{ steps.pages-base.outputs.base_path }}
        run: pnpm build:web

      - name: Audit built web URLs and CSP
        run: pnpm --filter @canadian-ham/web audit:urls

      # actions/upload-pages-artifact v5.0.0
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: apps/web/dist

      # actions/deploy-pages v5.0.1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
