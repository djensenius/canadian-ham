name: Test guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_guard:
    name: Test guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # actions/checkout v7.0.1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test test-guard checker
        run: node scripts/check-test-guard.mjs --self-test

      - name: Check guarded Apple test/view changes
        env:
          TEST_GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TEST_GUARD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_GUARD_PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-test-guard.mjs
