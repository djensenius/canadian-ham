      - name: Copy Basic and Advanced generated content
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../../content/generated/basic-2025-07-15/questions.json
          - $(SRCROOT)/../../content/generated/basic-2025-07-15/subsections.json
          - $(SRCROOT)/../../content/generated/basic-2025-07-15/categories.json
          - $(SRCROOT)/../../content/generated/basic-2025-07-15/manifest.json
          - $(SRCROOT)/../../content/generated/advanced-2025-02-04/questions.json
          - $(SRCROOT)/../../content/generated/advanced-2025-02-04/subsections.json
          - $(SRCROOT)/../../content/generated/advanced-2025-02-04/categories.json
          - $(SRCROOT)/../../content/generated/advanced-2025-02-04/manifest.json
        outputFiles:
