          cp "${SRCROOT}/../../content/generated/basic-2025-07-15/manifest.json" "${basic_destination}/manifest.json"
          cp "${SRCROOT}/../../content/generated/advanced-2025-02-04/questions.json" "${advanced_destination}/questions.json"
          cp "${SRCROOT}/../../content/generated/advanced-2025-02-04/subsections.json" "${advanced_destination}/subsections.json"
          cp "${SRCROOT}/../../content/generated/advanced-2025-02-04/categories.json" "${advanced_destination}/categories.json"
          cp "${SRCROOT}/../../content/generated/advanced-2025-02-04/manifest.json" "${advanced_destination}/manifest.json"
    dependencies:
      - target: CanadianHam
      - package: CanadianHamEngine
        product: CanadianHamEngine
      - package: CanadianHamContent
        product: CanadianHamContent
      - package: CanadianHamMorseEngine
        product: CanadianHamMorseEngine
