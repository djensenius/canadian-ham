          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/generated/basic-2025-07-15/subsections.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/generated/basic-2025-07-15/categories.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/generated/basic-2025-07-15/manifest.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/generated/advanced-2025-02-04/questions.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/generated/advanced-2025-02-04/subsections.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/generated/advanced-2025-02-04/categories.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/generated/advanced-2025-02-04/manifest.json
        script: |
          set -euo pipefail
          generated_destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/generated"
          basic_destination="${generated_destination}/basic-2025-07-15"
          advanced_destination="${generated_destination}/advanced-2025-02-04"
          mkdir -p "${basic_destination}" "${advanced_destination}"
          cp "${SRCROOT}/../../content/generated/basic-2025-07-15/questions.json" "${basic_destination}/questions.json"
