  CanadianHamWatch:
    type: application
    platform: watchOS
    deploymentTarget: "27.0"
    sources:
      - path: Platforms/watchOS
      - path: CanadianHam/Resources/Localizable.xcstrings
        type: file
        buildPhase: resources
    dependencies:
      - package: CanadianHamEngine
        product: CanadianHamEngine
      - package: CanadianHamContent
        product: CanadianHamContent
      - package: CanadianHamMorseEngine
        product: CanadianHamMorseEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.CanadianHam.watchkitapp
        PRODUCT_NAME: CanadianHamWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Canadian Ham
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: org.davidjensenius.CanadianHam
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_ENTITLEMENTS: ""
        # Override project DebugCloudKit flags: the watch never compiles iCloud code.
        OTHER_SWIFT_FLAGS: ""
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
