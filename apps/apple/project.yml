name: CanadianHam
options:
  bundleIdPrefix: org.davidjensenius
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
    tvOS: "27.0"
    visionOS: "27.0"
    watchOS: "27.0"
  developmentLanguage: en
  knownRegions: [en, fr, fr-CA]
  createIntermediateGroups: true
configs:
  Debug: debug
  DebugCloudKit: debug
  Release: release
packages:
  CanadianHamEngine:
    path: ../../packages/engine-swift
  CanadianHamContent:
    path: ../../packages/content-swift
  CanadianHamMorseEngine:
    path: ../../packages/morse-swift
  CanadianHamCalculatorEngine:
    path: ../../packages/calculator-swift
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: 9JALHNGRBQ
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    TVOS_DEPLOYMENT_TARGET: "27.0"
    XROS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic
    SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphone*27.0*]: $(inherited) NO_HINGE_API
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      OTHER_SWIFT_FLAGS: $(inherited) -DOFFICIAL_REFERENCE_SHEET
    DebugCloudKit:
      OTHER_SWIFT_FLAGS: $(inherited) -DICLOUD_SYNC -DOFFICIAL_REFERENCE_SHEET
targets:
  CanadianHam:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: CanadianHam
        excludes:
          - Resources/AppIcon.icon
          - Resources/Assets.xcassets
          - Resources/FigureAssets.xcassets
          - Resources/CanadianHam.iOS.CloudKit.Info.plist
      - path: Platforms/Shared/ApplePreferences.swift
      - path: Platforms/Shared/PlatformLessonMarkdownView.swift
      - path: CanadianHam/Resources/AppIcon.icon
        buildPhase: resources
      - path: CanadianHam/Resources/Assets.xcassets
      - path: CanadianHam/Resources/FigureAssets.xcassets
      - path: CanadianHam/Resources/Localizable.xcstrings
        type: file
        buildPhase: resources
      - path: ../../content/lessons
        type: folder
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/quizzes
        type: folder
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/explanations
        type: folder
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/hints
        type: folder
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/subsection-titles.json
        type: file
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../fixtures/morse/course.json
        type: file
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/reference-sheet
        type: folder
        buildPhase: resources
        createIntermediateGroups: false
    postBuildScripts:
      - name: Copy gated official exam reference sheet
        basedOnDependencyAnalysis: false
        script: bash "${SRCROOT}/../../scripts/copy-official-reference-sheet.sh"
      - name: Remove content authoring README files
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          resource_destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          for content_directory in lessons quizzes explanations hints; do
            destination="${resource_destination}/${content_directory}"
            if [ -d "${destination}" ]; then
              find "${destination}" -type f -iname README.md -delete
            fi
          done
      - name: Copy Basic and Advanced generated content
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../../content/generated/basic-2025-07-15/questions.json
          - $(SRCROOT)/../../content/generated/basic-2025-07-15/subsections.json
          - $(SRCROOT)/../../content/generated/basic-2025-07-15/categories.json
          - $(SRCROOT)/../../content/generated/basic-2025-07-15/manifest.json
          - $(SRCROOT)/../../content/generated/advanced-2025-02-04/questions.json
          - $(SRCROOT)/../../content/generated/advanced-2025-02-04/subsections.json
          - $(SRCROOT)/../../content/generated/advanced-2025-02-04/categories.json
          - $(SRCROOT)/../../content/generated/advanced-2025-02-04/manifest.json
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/generated/basic-2025-07-15/questions.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/generated/basic-2025-07-15/subsections.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/generated/basic-2025-07-15/categories.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/generated/basic-2025-07-15/manifest.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/generated/advanced-2025-02-04/questions.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/generated/advanced-2025-02-04/subsections.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/generated/advanced-2025-02-04/categories.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/generated/advanced-2025-02-04/manifest.json
        script: |
          set -euo pipefail
          generated_destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/generated"
          basic_destination="${generated_destination}/basic-2025-07-15"
          advanced_destination="${generated_destination}/advanced-2025-02-04"
          mkdir -p "${basic_destination}" "${advanced_destination}"
          cp "${SRCROOT}/../../content/generated/basic-2025-07-15/questions.json" "${basic_destination}/questions.json"
          cp "${SRCROOT}/../../content/generated/basic-2025-07-15/subsections.json" "${basic_destination}/subsections.json"
          cp "${SRCROOT}/../../content/generated/basic-2025-07-15/categories.json" "${basic_destination}/categories.json"
          cp "${SRCROOT}/../../content/generated/basic-2025-07-15/manifest.json" "${basic_destination}/manifest.json"
          cp "${SRCROOT}/../../content/generated/advanced-2025-02-04/questions.json" "${advanced_destination}/questions.json"
          cp "${SRCROOT}/../../content/generated/advanced-2025-02-04/subsections.json" "${advanced_destination}/subsections.json"
          cp "${SRCROOT}/../../content/generated/advanced-2025-02-04/categories.json" "${advanced_destination}/categories.json"
          cp "${SRCROOT}/../../content/generated/advanced-2025-02-04/manifest.json" "${advanced_destination}/manifest.json"
    dependencies:
      - target: CanadianHamWatch
        embed: true
        destinationFilters: [iOS]
      - package: CanadianHamEngine
        product: CanadianHamEngine
      - package: CanadianHamContent
        product: CanadianHamContent
      - package: CanadianHamMorseEngine
        product: CanadianHamMorseEngine
      - package: CanadianHamCalculatorEngine
        product: CanadianHamCalculatorEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.CanadianHam
        PRODUCT_NAME: CanadianHam
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Canadian Ham
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # App Store validation (iOS 27 SDK): a launch screen and all four iPad
        # orientations (multitasking) are required. iPhone supports landscape too
        # (WCAG 1.3.4: don't lock orientation without need).
        INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphone*]: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone[sdk=iphone*]: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: CanadianHam/Resources/CanadianHam.macOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: ""
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        DebugCloudKit:
          CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: CanadianHam/Resources/CanadianHam.macOS.CloudKit.entitlements
          CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: CanadianHam/Resources/CanadianHam.iOS.CloudKit.entitlements
          GENERATE_INFOPLIST_FILE[sdk=iphone*]: NO
          INFOPLIST_FILE[sdk=iphone*]: CanadianHam/Resources/CanadianHam.iOS.CloudKit.Info.plist
          INFOPLIST_KEY_UIBackgroundModes: remote-notification
  CanadianHamTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: CanadianHamTests
      - path: CanadianHam/Models/QuestionBankModels.swift
      - path: CanadianHam/Services/QuestionBankStore.swift
      - path: Platforms/Shared/ApplePreferences.swift
      - path: CanadianHam/Services/ProgressStore.swift
      - path: CanadianHam/Services/ProgressSyncMerge.swift
      - path: CanadianHam/Services/AppleStudyEngine.swift
      - path: CanadianHam/Models/ProgressModels.swift
      - path: CanadianHam/Practice/EngineShuffle.swift
      - path: CanadianHam/Practice/HintSessionState.swift
      - path: CanadianHam/Support/LaunchArguments.swift
      - path: CanadianHam/Support/DuoPostureProvider.swift
      - path: CanadianHam/ExamTools/ExamToolModels.swift
      - path: ../../content/lessons
        type: folder
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/quizzes
        type: folder
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/explanations
        type: folder
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/hints
        type: folder
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/subsection-titles.json
        type: file
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../fixtures/morse/course.json
        type: file
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/reference-sheet
