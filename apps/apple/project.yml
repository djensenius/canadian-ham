      - path: Platforms/tvOS
      - path: CanadianHam/Models/QuestionBankModels.swift
      - path: CanadianHam/Services/QuestionBankStore.swift
      - path: CanadianHam/Practice/EngineShuffle.swift
      - path: CanadianHam/Morse/MorseTrainerSettings.swift
      - path: CanadianHam/Morse/MorseAudioDriver.swift
      - path: CanadianHam/Design/Tokens.swift
      - path: CanadianHam/Support/LaunchArguments.swift
      - path: CanadianHam/Resources/Localizable.xcstrings
        type: file
        buildPhase: resources
      - path: CanadianHam/Resources/PrivacyInfo.xcprivacy
        type: file
        buildPhase: resources
      - path: ../../content/generated/basic-2025-07-15/questions.json
        type: file
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/generated/basic-2025-07-15/subsections.json
        type: file
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/generated/basic-2025-07-15/categories.json
        type: file
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/generated/basic-2025-07-15/manifest.json
        type: file
        buildPhase: resources
        createIntermediateGroups: false
    dependencies:
      - package: CanadianHamEngine
        product: CanadianHamEngine
      - package: CanadianHamMorseEngine
        product: CanadianHamMorseEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djensenius.CanadianHam.TV
        PRODUCT_NAME: CanadianHamTV
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Canadian Ham TV
