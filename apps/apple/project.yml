    build:
      targets:
        CanadianHam: all
        CanadianHamTests: [test]
        CanadianHamUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - CanadianHamTests
        - CanadianHamUITests
  CanadianHamTV:
