name: CanadianHam
options:
  bundleIdPrefix: com.djensenius
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CanadianHam:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: CanadianHam
      - path: ../../content/generated/basic-2025-07-15/questions.json
        type: file
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/generated/basic-2025-07-15/subsections.json
        type: file
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/generated/basic-2025-07-15/categories.json
        type: file
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/generated/basic-2025-07-15/manifest.json
        type: file
        buildPhase: resources
        createIntermediateGroups: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djensenius.CanadianHam
        PRODUCT_NAME: CanadianHam
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Canadian Ham
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: CanadianHam/Resources/CanadianHam.macOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: ""
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
  CanadianHamTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: CanadianHamTests
      - path: CanadianHam/Models/QuestionBankModels.swift
      - path: CanadianHam/Services/QuestionBankStore.swift
      - path: CanadianHam/Practice/TempShuffle.swift
      - path: ../../content/generated/basic-2025-07-15/questions.json
        type: file
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/generated/basic-2025-07-15/subsections.json
        type: file
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/generated/basic-2025-07-15/categories.json
        type: file
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../../content/generated/basic-2025-07-15/manifest.json
        type: file
        buildPhase: resources
        createIntermediateGroups: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djensenius.CanadianHamTests
        PRODUCT_NAME: CanadianHamTests
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
  CanadianHamUITests:
    type: bundle.ui-testing
    platform: auto
    supportedDestinations: [iOS]
    sources:
      - path: CanadianHamUITests
    dependencies:
      - target: CanadianHam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djensenius.CanadianHamUITests
        PRODUCT_NAME: CanadianHamUITests
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
schemes:
  CanadianHam:
    build:
      targets:
        CanadianHam: all
        CanadianHamTests: [test]
        CanadianHamUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - CanadianHamTests
        - CanadianHamUITests
