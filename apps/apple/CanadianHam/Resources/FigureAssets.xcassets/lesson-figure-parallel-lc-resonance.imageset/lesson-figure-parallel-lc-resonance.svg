<svg id="parallel-lc-resonance" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img">
  <title>Parallel LC circuit at resonance</title>
  <desc>An inductor L and capacitor C share top and bottom rails. This parallel tuned circuit has high impedance at resonance.</desc>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130 140 C180 140 290 140 350 140" stroke-width="7"/>
    <path d="M130 340 C180 340 290 340 350 340" stroke-width="7"/>
    <path d="M176 140 C176 156 176 166 176 178" stroke-width="7"/>
    <path d="M176 178 C142 190 142 216 176 228" stroke-width="8"/>
    <path d="M176 228 C142 240 142 266 176 278" stroke-width="8"/>
    <path d="M176 278 C142 290 142 316 176 328" stroke-width="8"/>
    <path d="M176 328 C176 334 176 336 176 340" stroke-width="7"/>
    <path d="M306 140 C306 166 306 178 306 198" stroke-width="7"/>
    <path d="M272 198 C294 198 318 198 340 198" stroke-width="8"/>
    <path d="M272 278 C294 278 318 278 340 278" stroke-width="8"/>
    <path d="M306 278 C306 304 306 320 306 340" stroke-width="7"/>
  </g>
  <g fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="240" y="58" font-size="36" font-weight="700">parallel LC</text>
    <text x="106" y="260" font-size="36">L</text>
    <text x="374" y="260" font-size="36">C</text>
    <text x="240" y="418" font-size="24">high Z at resonance</text>
  </g>
</svg>
