<svg id="signal-quality-cw-ssb-fm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>CW, SSB, and FM signal quality</title>
  <desc>Three panels compare clean CW keying, SSB voice peaks below the ALC limit, and FM deviation that grows too wide.</desc>
