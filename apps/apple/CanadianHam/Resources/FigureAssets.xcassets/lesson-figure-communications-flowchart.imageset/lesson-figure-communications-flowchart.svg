    <text x="318" y="102" font-size="24">listen</text>
    <text x="330" y="44" font-size="24">change/stop</text>
    <text x="88" y="208" font-size="24" font-weight="700">distress</text>
    <text x="314" y="206" font-size="24">exception</text>
