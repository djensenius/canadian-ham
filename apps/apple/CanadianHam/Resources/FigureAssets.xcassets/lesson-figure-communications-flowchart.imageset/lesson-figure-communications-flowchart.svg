    <line x1="160" y1="368" x2="570" y2="368" stroke-width="6"/><polygon points="570,368 550,356 550,380" fill="currentColor" stroke="none"/>
    <circle cx="100" cy="128" r="30" stroke-width="5"/><path d="M82 128 L118 128" stroke-width="5"/>
    <path d="M84 248 L100 226 L116 248 L100 270 Z" stroke-width="5"/>
    <circle cx="100" cy="368" r="30" stroke-width="5"/><path d="M82 368 L118 368" stroke-width="5"/>
    <path d="M250 108 L282 128 L250 148" stroke-width="5"/><path d="M402 108 L434 128 L402 148" stroke-width="5"/>
    <path d="M250 228 L282 248 L250 268" stroke-width="5"/><path d="M402 228 L434 248 L402 268" stroke-width="5"/>
    <path d="M250 348 L282 368 L250 388" stroke-width="5"/><path d="M402 348 L434 368 L402 388" stroke-width="5"/>
    <circle cx="536" cy="52" r="28" stroke-width="5"/><line x1="536" y1="52" x2="536" y2="34" stroke-width="4"/><line x1="536" y1="52" x2="552" y2="62" stroke-width="4"/>
