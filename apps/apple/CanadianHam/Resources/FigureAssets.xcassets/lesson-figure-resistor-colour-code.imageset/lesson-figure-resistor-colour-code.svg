<svg id="resistor-colour-code" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img">
  <title>Four-band resistor colour code</title>
  <desc>A labelled four-band resistor example showing digit, multiplier, and tolerance band positions without relying on band colour alone.</desc>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <line x1="45" y1="270" x2="150" y2="270" stroke-width="10"/>
    <line x1="760" y1="270" x2="855" y2="270" stroke-width="10"/>
    <path d="M150 225 C205 212 705 212 760 225 L760 315 C705 328 205 328 150 315 Z" stroke-width="8"/>
    <line x1="115" y1="176" x2="250" y2="220" stroke-width="4"/>
    <line x1="290" y1="176" x2="340" y2="220" stroke-width="4"/>
    <line x1="505" y1="176" x2="480" y2="220" stroke-width="4"/>
    <line x1="760" y1="176" x2="655" y2="220" stroke-width="4"/>
    <line x1="230" y1="500" x2="670" y2="500" stroke-width="6"/>
    <path d="M230 500 L253 488 L253 512 Z" stroke-width="4"/>
    <path d="M670 500 L647 488 L647 512 Z" stroke-width="4"/>
    <line x1="450" y1="485" x2="450" y2="515" stroke-width="5"/>
  </g>
  <g fill="currentColor">
    <rect x="250" y="220" width="38" height="100"/>
    <rect x="340" y="220" width="38" height="100"/>
    <rect x="480" y="220" width="38" height="100"/>
    <rect x="655" y="220" width="38" height="100"/>
  </g>
  <g fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="115" y="60" font-size="34" font-weight="700">1st digit</text>
    <text x="115" y="102" font-size="34">yellow</text>
    <text x="115" y="144" font-size="34">4</text>
    <text x="290" y="60" font-size="34" font-weight="700">2nd digit</text>
    <text x="290" y="102" font-size="34">violet</text>
    <text x="290" y="144" font-size="34">7</text>
    <text x="505" y="60" font-size="34" font-weight="700">multiplier</text>
    <text x="505" y="102" font-size="34">red</text>
    <text x="505" y="144" font-size="34">x 100</text>
    <text x="760" y="60" font-size="34" font-weight="700">tolerance</text>
    <text x="760" y="102" font-size="34">gold</text>
    <text x="760" y="144" font-size="34">±5%</text>
    <text x="450" y="370" font-size="38">yellow violet red gold</text>
    <text x="450" y="420" font-size="38">47 x 100 = 4 700 Ω</text>
    <text x="450" y="465" font-size="34">±5% tolerance range</text>
    <text x="230" y="560" font-size="34">4 465 Ω</text>
    <text x="450" y="560" font-size="34">4 700 Ω</text>
    <text x="670" y="560" font-size="34">4 935 Ω</text>
    <text x="450" y="620" font-size="34">meter confirms critical values</text>
  </g>
</svg>
