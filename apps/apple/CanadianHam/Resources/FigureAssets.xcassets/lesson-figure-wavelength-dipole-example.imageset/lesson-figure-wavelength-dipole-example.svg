<svg id="wavelength-dipole-example" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img">
  <title>Wavelength and half-wave dipole estimate</title>
  <desc>A formula card for wavelength in metres, with free-space and practical first-cut half-wave dipole length examples.</desc>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <line x1="170" y1="330" x2="455" y2="330" stroke-width="10"/>
    <line x1="545" y1="330" x2="830" y2="330" stroke-width="10"/>
    <line x1="455" y1="330" x2="455" y2="380" stroke-width="7"/>
    <line x1="545" y1="330" x2="545" y2="380" stroke-width="7"/>
    <line x1="170" y1="425" x2="830" y2="425" stroke-width="6"/>
    <path d="M170 425 L194 413 L194 437 Z" stroke-width="4"/>
    <path d="M830 425 L806 413 L806 437 Z" stroke-width="4"/>
    <line x1="500" y1="412" x2="500" y2="438" stroke-width="5"/>
  </g>
  <g fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="500" y="70" font-size="50" font-weight="700">λ(m) = 300 / f(MHz)</text>
    <text x="500" y="140" font-size="38">14.2 MHz example: λ ≈ 21.1 m</text>
    <text x="500" y="235" font-size="38">half-wave dipole</text>
    <text x="500" y="285" font-size="38">feed point gap</text>
    <text x="500" y="485" font-size="38">free-space half-wave ≈ 10.6 m</text>
    <text x="500" y="545" font-size="38">practical first cut ≈ 143 / f</text>
    <text x="500" y="600" font-size="38">≈ 10.1 m at 14.2 MHz</text>
  </g>
</svg>
