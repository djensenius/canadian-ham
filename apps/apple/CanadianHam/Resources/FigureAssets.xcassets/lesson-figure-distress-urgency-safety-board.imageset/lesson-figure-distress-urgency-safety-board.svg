<svg id="distress-urgency-safety-board" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Distress urgency safety priority board</title>
  <desc>Priority note board and go-kit with labelled handheld, battery, and centre-fed dipole.</desc>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <rect x="42" y="64" width="342" height="306" rx="20" ry="20" stroke-width="7"/>
    <line x1="72" y1="232" x2="354" y2="232" stroke-width="5"/>
    <line x1="72" y1="296" x2="354" y2="296" stroke-width="5"/>
    <rect x="432" y="252" width="156" height="96" rx="18" ry="18" stroke-width="6"/>
    <rect x="440" y="120" width="50" height="82" rx="10" ry="10" stroke-width="5"/><line x1="465" y1="120" x2="465" y2="94" stroke-width="4"/><circle cx="465" cy="164" r="9" stroke-width="4"/>
    <rect x="538" y="130" width="48" height="42" rx="7" ry="7" stroke-width="5"/>
    <line x1="454" y1="294" x2="574" y2="294" stroke-width="5"/><line x1="514" y1="294" x2="514" y2="318" stroke-width="5"/>
  </g>
  <g fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="213" y="112" font-size="30" font-weight="700">distress</text><text x="213" y="148" font-size="24">life threat</text><text x="213" y="186" font-size="24">MAYDAY / SOS</text><text x="213" y="216" font-size="24">first priority</text><text x="213" y="274" font-size="24">urgent: serious help</text><text x="213" y="336" font-size="24">safety: hazard info</text>
    <text x="464" y="232" font-size="24">handheld</text><text x="562" y="118" font-size="24">battery</text><text x="514" y="382" font-size="24">go-kit</text><text x="514" y="286" font-size="24">dipole</text>
  </g>
</svg>
