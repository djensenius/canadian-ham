<svg id="records-maps-locators" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Station log and azimuthal map</title>
  <desc>Six-column station log, UTC clock, grid note, and opposite short and long paths on a centred azimuthal map.</desc>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <rect x="40" y="76" width="296" height="244" rx="18" ry="18" stroke-width="7"/><line x1="62" y1="126" x2="314" y2="126" stroke-width="5"/>
    <line x1="86" y1="146" x2="86" y2="290" stroke-width="4"/><line x1="128" y1="146" x2="128" y2="290" stroke-width="4"/><line x1="176" y1="146" x2="176" y2="290" stroke-width="4"/><line x1="224" y1="146" x2="224" y2="290" stroke-width="4"/><line x1="270" y1="146" x2="270" y2="290" stroke-width="4"/>
    <line x1="64" y1="176" x2="312" y2="176" stroke-width="3"/><line x1="64" y1="222" x2="312" y2="222" stroke-width="3"/><line x1="64" y1="268" x2="312" y2="268" stroke-width="3"/>
    <circle cx="484" cy="208" r="106" stroke-width="7"/><line x1="484" y1="102" x2="484" y2="314" stroke-width="4"/><line x1="378" y1="208" x2="590" y2="208" stroke-width="4"/><circle cx="484" cy="208" r="10" stroke-width="5"/>
    <line x1="484" y1="208" x2="558" y2="134" stroke-width="6"/><polygon points="558,134 536,142 550,156" fill="currentColor" stroke="none"/><line x1="484" y1="208" x2="410" y2="282" stroke-width="6"/><polygon points="410,282 432,274 418,260" fill="currentColor" stroke="none"/>
    <circle cx="116" cy="386" r="36" stroke-width="5"/><line x1="116" y1="386" x2="116" y2="360" stroke-width="4"/><line x1="116" y1="386" x2="136" y2="398" stroke-width="4"/>
  </g>
  <g fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="74" y="62" font-size="24">U</text><text x="112" y="62" font-size="24">C</text><text x="160" y="62" font-size="24">B</text><text x="208" y="62" font-size="24">M</text><text x="256" y="62" font-size="24">R</text><text x="302" y="62" font-size="24">G</text>
    <text x="484" y="58" font-size="28" font-weight="700">azimuthal</text><text x="574" y="100" font-size="24">short</text><text x="414" y="348" font-size="24">long</text><text x="116" y="446" font-size="24">UTC</text><text x="552" y="348" font-size="24">grid</text>
  </g>
</svg>
